# ── www.kreationhotels.com → Website ──

server {
    listen 80;
    server_name www.kreationhotels.com kreationhotels.com;

    # Certbot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect HTTP → HTTPS
    location / {
        return 301 https://www.kreationhotels.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name www.kreationhotels.com kreationhotels.com;

    # SSL (managed by certbot)
    ssl_certificate     /etc/letsencrypt/live/www.kreationhotels.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.kreationhotels.com/privkey.pem;

    # Redirect bare domain to www
    if ($host = kreationhotels.com) {
        return 301 https://www.kreationhotels.com$request_uri;
    }

    # Security headers
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";

    # API requests → Website Backend
    location /api/ {
        proxy_pass http://website-backend:8002/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 10M;
    }

    # Static build assets → Website Frontend
    location /static/ {
        proxy_pass http://website-frontend:80/static/;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location ~* \.(?:js|css|map|png|jpe?g|gif|svg|ico|webp|woff2?|ttf|json|txt)$ {
        proxy_pass http://website-frontend:80;
        proxy_set_header Host $host;
    }

    # Dynamic SEO files → Website Backend (generated from CRM SEO settings)
    location = /sitemap.xml {
        proxy_pass http://website-backend:8002/sitemap.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /robots.txt {
        proxy_pass http://website-backend:8002/robots.txt;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Page HTML → Website Backend (injects title / meta / Open Graph / JSON-LD for crawlers & social previews)
    # Falls back to the plain SPA shell if the backend is unavailable.
    location / {
        proxy_pass http://website-backend:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @spa_fallback;
    }
    location @spa_fallback {
        proxy_pass http://website-frontend:80;
        proxy_set_header Host $host;
    }
}
